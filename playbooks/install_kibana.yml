---
- name: Instalacja Kibana
  hosts: all
  become: true
  tasks:
    - name: Dodaj klucz GPG Elastic do menedżera RPM
      ansible.builtin.rpm_key:
        state: present
        key: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    - name: Install Kibana
      ansible.builtin.dnf:
        name: /tmp/kibana_installer/kibana-9.4.6-x86_64.rpm
        state: present
