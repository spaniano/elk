---
- name: Pobieranie Kibana (RPM) na Rocky Linux
  hosts: all
  become: true
  vars:
    kibana_version: "9.4.6"
    elasticsearch_arch: "x86_64"
    download_dir: "/tmp/kibana_installer"
    rpm_filename: "kibana-{{ elasticsearch_version }}-{{ elasticsearch_arch }}.rpm"
    download_url: "https://artifacts.elastic.co/downloads/kibana/{{ rpm_filename }}"
  
  tasks:
    - name: Utwórz katalog na pobierane pliki
      ansible.builtin.file:
        path: "{{ download_dir }}"
        state: directory
        mode: '0755'

    - name: Pobierz pakiet RPM Kibana wraz ze sprawdzaniem sumy SHA512
      ansible.builtin.get_url:
        url: "{{ download_url }}"
        dest: "{{ download_dir }}/{{ rpm_filename }}"
        checksum: "sha512:{{ download_url }}.sha512"
        mode: '0644'
      register: download_result

    - name: Informacja o stanie pobierania
      ansible.builtin.debug:
        msg: "Pakiet RPM został pomyślnie pobrany do {{ download_result.dest }}"
