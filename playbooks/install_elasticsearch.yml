---
- name: Instalacja stacku ELK
  hosts: all
  become: true
  tasks:
    - name: Dodaj klucz GPG Elastic do menedżera RPM
      ansible.builtin.rpm_key:
        state: present
        key: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    - name: Utworzenie użytkownika elasticsearch
	ansible.builtin.user:
        name: elasticsearch
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/elasticsearch
        create_home: false
        state: present
