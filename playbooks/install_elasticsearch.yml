---
- name: Instalacja stacku ELK
  hosts: all
  become: true
  tasks:
    - name: Dodaj klucz GPG Elastic do menedżera RPM
      ansible.builtin.rpm_key:
        state: present
        key: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    - name: Utworzenie użytkownika elasticsearch
      ansible.builtin.user:
        name: elasticsearch
        system: true
        shell: /usr/sbin/nologin
        home: /var/lib/elasticsearch
        create_home: false
        state: present
    - name: Ustaw limity dla użytkownika elasticsearch
      ansible.builtin.lineinfile:
        path: /etc/security/limits.conf
        regexp: '^elasticsearch\s+-\s+{{ item.limit }}\s+'
        line: 'elasticsearch  -  {{ item.limit }}  {{ item.value }}'
        state: present
      loop:
        - { limit: 'nofile', value: '65535' }
        - { limit: 'nproc', value: '4096' }
        - { limit: 'memlock', value: 'unlimited' }
    - name: Install Elasticsearch
      ansible.builtin.dnf:
        name: /tmp/elasticsearch_installer/elasticsearch-9.4.6-x86_64.rpm
        state: present
