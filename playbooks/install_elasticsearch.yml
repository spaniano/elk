---
- name: Pobieranie i opcjonalna instalacja Elasticsearch (RPM) na Rocky Linux
  hosts: all
  become: true
  vars:
    elasticsearch_version: "9.4.6"
    elasticsearch_arch: "x86_64"
    download_dir: "/tmp/elasticsearch_installer"
    rpm_filename: "elasticsearch-{{ elasticsearch_version }}-{{ elasticsearch_arch }}.rpm"
    download_url: "https://artifacts.elastic.co/downloads/elasticsearch/{{ rpm_filename }}"
    install_package: false  # Zmień na true, jeśli chcesz od razu zainstalować paczkę

  tasks:
    - name: Utwórz katalog na pobierane pliki
      ansible.builtin.file:
        path: "{{ download_dir }}"
        state: directory
        mode: '0755'

    - name: Pobierz pakiet RPM Elasticsearch wraz ze sprawdzaniem sumy SHA512
      ansible.builtin.get_url:
        url: "{{ download_url }}"
        dest: "{{ download_dir }}/{{ rpm_filename }}"
        checksum: "sha512:{{ download_url }}.sha512"
        mode: '0644'
      register: download_result

    - name: Informacja o stanie pobierania
      ansible.builtin.debug:
        msg: "Pakiet RPM został pomyślnie pobrany do {{ download_result.dest }}"

    - name: Zainstaluj pobrany pakiet RPM Elasticsearch (opcjonalnie)
      ansible.builtin.dnf:
        name: "{{ download_dir }}/{{ rpm_filename }}"
        state: present
        disable_gpg_check: false
      when: install_package
